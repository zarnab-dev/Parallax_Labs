name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # `npm run build` also generates public/sw.js (prebuild step).
      - run: npm run build
      - name: Bundle size budgets
        run: npm run budget
      - name: Lighthouse CI (performance / a11y / best practices / SEO)
        run: npx lhci autorun
      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
